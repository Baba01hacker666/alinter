[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "alinter"
version = "0.1.0"
description = "A universal, config-driven linter: lint any language or format with declarative rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "baba01hacker" }]
keywords = [
  "linter",
  "lint",
  "static-analysis",
  "code-quality",
  "codestyle",
  "universal",
  "config-driven",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=5.4",
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
gitignore = ["pathspec>=0.11"]
xml = ["defusedxml>=0.7"]
dev = [
  "pytest>=7.0",
  "build>=1.0",
  "pyflakes>=3.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "defusedxml>=0.7",
]

[project.scripts]
alinter = "alinter.cli:main"

[project.urls]
Homepage = "https://github.com/Baba01hacker666/alinter"
Repository = "https://github.com/Baba01hacker666/alinter"
Issues = "https://github.com/Baba01hacker666/alinter/issues"
Changelog = "https://github.com/Baba01hacker666/alinter/blob/main/CHANGELOG.md"

[project.entry-points."alinter.checks"]
# Third-party plugins register custom check types here:
#   my-check = "my_package.checks:MyCheck"

[tool.hatch.build.targets.wheel]
packages = ["src/alinter"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "examples"]
exclude = [".venv", "dist", "build", ".git"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "PIE",  # flake8-pie
  "PERF", # perflint
  "BLE",  # flake8-blind-except
]
ignore = [
  "E501",    # line length is enforced by alinter itself (python/max-line-length)
  "RUF012",  # mutable class attributes are intentional (class-level defaults)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "BLE001",  # tests deliberately exercise failure paths
  "SIM117",  # nested with-statements read better in some tests
  "B011",    # assert False is fine in tests
]
"examples/**" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["alinter"]

[tool.bandit]
targets = ["src/alinter"]
exclude_dirs = ["tests", ".venv", "dist", "build"]
# Intentional `# nosec` sites in the source document why subprocess/XML usage is
# safe; no blanket skips are needed here.

